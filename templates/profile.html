{% extends "base.html" %}
{% block title %}My profile{% endblock %}
{% block main_class %}wide page{% endblock %}
{% block content %}
<h1>My profile</h1>
<div class="box"><h2>Your details</h2>
  <form method="POST"><input type="hidden" name="action" value="details">
    <label>Full name</label><input type="text" name="full_name" value="{{ customer.full_name }}" required>
    <label>Email</label><input type="email" value="{{ customer.email }}" disabled>
    <label>Phone</label><input type="text" name="phone" value="{{ customer.phone }}" required>
    <label>Current address</label><p class="muted">{{ customer.address }}</p>
    <label>Change address: colony (optional)</label>
    <select name="locality"><option value="">Keep my current address</option>{% for name in localities %}<option value="{{ name }}">{{ name }}</option>{% endfor %}</select>
    <label>House / flat details (needed if you pick a colony)</label><input type="text" name="house">
    <button type="submit">Save details</button></form></div>
<div class="box"><h2>Change password</h2>
  <form method="POST"><input type="hidden" name="action" value="password">
    <label>Current password</label><input type="password" name="current" required>
    <label>New password (at least 8 characters, with a letter and a number)</label><input type="password" name="new" minlength="8" required>
    <button type="submit">Change password</button></form></div>
{% endblock %}
