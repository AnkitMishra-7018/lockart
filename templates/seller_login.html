{% extends "base.html" %}

{% block title %}Seller Login{% endblock %}

{% block content %}
    <h1>Seller Login</h1>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p>New seller? <a href="/seller/register">Register your shop</a></p>

    {% if demo_mode %}
    <div class="demo-login">
        <p><strong>Demo mode</strong>: sign in with one click</p>
        <form method="POST" action="/demo-login/bigmart"><button type="submit" class="small">Busy shop (Demo Big Mart)</button></form>
        <form method="POST" action="/demo-login/newstore"><button type="submit" class="small">New shop (Demo New Store)</button></form>
    </div>
    {% endif %}
{% endblock %}
