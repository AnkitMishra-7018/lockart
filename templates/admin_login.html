{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
    <h1>Admin Login</h1>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
{% endblock %}
